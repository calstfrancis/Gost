app-id: ca.calstfrancis.Gost
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gost

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # LanguageTool grammar check (languagetool.py)
  - --share=network
  # Export destinations. Anything outside Documents comes through the file
  # portal via Gtk.FileDialog, which needs no static permission.
  - --filesystem=xdg-documents

modules:
  - python3-deps.json

  - name: gost
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/calstfrancis/gost.git
        branch: main
      # Bundled Typst compiler — same musl build Rubric ships, so preview works
      # inside the sandbox with no host install and no flatpak-spawn escape.
      - type: archive
        url: https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz
        sha256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
        dest: typst-bin
    build-commands:
      - cp CHANGELOG.md essay_builder/data/CHANGELOG.md
      - pip3 install --prefix=/app --no-build-isolation --no-deps .
      - install -Dm755 typst-bin/typst /app/bin/typst
      # Fonts go to /app/share/fonts so the sandboxed typst finds them via
      # fontconfig; setup_bundled_fonts() is skipped under flatpak accordingly.
      - install -Dm644 essay_builder/fonts/gosttypeb.ttf /app/share/fonts/gosttypeb.ttf
      - install -Dm644 ca.calstfrancis.Gost.desktop /app/share/applications/ca.calstfrancis.Gost.desktop
      - install -Dm644 icons/gost.svg /app/share/icons/hicolor/scalable/apps/ca.calstfrancis.Gost.svg
      - install -Dm644 icons/gost-symbolic.svg /app/share/icons/hicolor/scalable/apps/ca.calstfrancis.Gost-symbolic.svg
      # install.sh rasterises these same sizes alongside the SVG (see its
      # rsvg-convert loop), because launchers that don't invoke an SVG loader
      # show a blank or generic icon for SVG-only apps. The flatpak manifest
      # never did the same, so the icon showed inconsistently for flatpak
      # installs depending on the launcher.
      - |
        for SIZE in 16 24 32 48 64 96 128 256; do
          mkdir -p "/app/share/icons/hicolor/${SIZE}x${SIZE}/apps"
          rsvg-convert -w "${SIZE}" -h "${SIZE}" icons/gost.svg \
            -o "/app/share/icons/hicolor/${SIZE}x${SIZE}/apps/ca.calstfrancis.Gost.png"
        done
      - install -Dm644 ca.calstfrancis.Gost.metainfo.xml /app/share/metainfo/ca.calstfrancis.Gost.metainfo.xml
